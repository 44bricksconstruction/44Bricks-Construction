<head>

<x-dc>
<div ref="{{ progressRef }}" style="position:fixed;top:0;left:0;height:3px;width:0;background:#C9972C;z-index:61;pointer-events:none"></div>

    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Main" style="flex:1;display:flex;justify-content:flex-end;gap:26px;font-size:14px;font-weight:500;white-space:nowrap">
        <a href="About.dc.html" style="color:{{ c.about }};padding:6px 0;border-bottom:2px solid {{ u.about }}" style-hover="color:#003399">About</a>
        <a href="Services.dc.html" style="color:{{ c.services }};padding:6px 0;border-bottom:2px solid {{ u.services }}" style-hover="color:#003399">Services</a>
        <a href="Team.dc.html" style="color:{{ c.team }};padding:6px 0;border-bottom:2px solid {{ u.team }}" style-hover="color:#003399">Team</a>
        <a href="Projects.dc.html" style="color:{{ c.projects }};padding:6px 0;border-bottom:2px solid {{ u.projects }}" style-hover="color:#003399">Projects</a>
        <a href="Hub.dc.html" style="color:{{ c.hub }};padding:6px 0;border-bottom:2px solid {{ u.hub }}" style-hover="color:#003399">Property Hub</a>
        <a href="Contact.dc.html" style="color:{{ c.contact }};padding:6px 0;border-bottom:2px solid {{ u.contact }}" style-hover="color:#003399">Contact</a>
      </nav>
      <a href="Contact.dc.html#start" style="flex:none;background:#003399;color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:2px" style-hover="background:#0A1A3C;color:#fff">Start your project</a>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1"></div>
      <button onClick="{{ toggle }}" aria-expanded="{{ openStr }}" aria-label="Menu" style="cursor:pointer;flex:none;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid #0F1B33;background:transparent;color:#0F1B33;font-size:14px;font-weight:600;border-radius:2px">
        <span style="display:flex;flex-direction:column;gap:4px;width:18px"><span style="height:2px;background:#0F1B33;transition:transform .2s;transform:{{ bar1 }}"></span><span style="height:2px;background:#0F1B33;transition:opacity .2s;opacity:{{ bar2 }}"></span><span style="height:2px;background:#0F1B33;transition:transform .2s;transform:{{ bar3 }}"></span></span>{{ menuLabel }}
      </button>
    </sc-if>
  </div>
</header>
<div style="height:68px"></div>

      <a href="mailto:44bricksconstruction@gmail.com" style="color:#E3B75B;overflow-wrap:anywhere"><!--email_off-->44bricksconstruction@gmail.com<!--/email_off--></a>

      <a href="https://www.instagram.com/44_bricks/" target="_blank" rel="noopener" aria-label="44 BRICKS on Instagram" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid rgba(255,255,255,.35);border-radius:2px;color:#fff;font-weight:600;font-size:14px" style-hover="background:#E3B75B;color:#0A1A3C;border-color:#E3B75B"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM21.9 7.1a5.8 5.8 0 0 0-1.6-4.1 5.8 5.8 0 0 0-4.1-1.6C14.6 1.3 9.4 1.3 7.8 1.4a5.8 5.8 0 0 0-4.1 1.6A5.8 5.8 0 0 0 2.1 7c-.1 1.6-.1 6.8 0 8.4a5.8 5.8 0 0 0 1.6 4.1 5.8 5.8 0 0 0 4.1 1.6c1.6.1 6.8.1 8.4 0a5.8 5.8 0 0 0 4.1-1.6 5.8 5.8 0 0 0 1.6-4.1c.1-1.6.1-6.8 0-8.3Zm-2.1 10.1a3.3 3.3 0 0 1-1.9 1.9c-1.3.5-4.4.4-5.9.4s-4.6.1-5.9-.4a3.3 3.3 0 0 1-1.9-1.9c-.5-1.3-.4-4.4-.4-5.9s-.1-4.6.4-5.9A3.3 3.3 0 0 1 6.1 3.5c1.3-.5 4.4-.4 5.9-.4s4.6-.1 5.9.4a3.3 3.3 0 0 1 1.9 1.9c.5 1.3.4 4.4.4 5.9s.1 4.6-.4 5.9Z"></path></svg>Instagram</a>

<sc-if value="{{ showTop }}" hint-placeholder-val="{{ false }}">
  <button onClick="{{ toTop }}" aria-label="Back to top" style="cursor:pointer;position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 68px);z-index:58;width:48px;height:48px;border-radius:2px;border:0;background:#0F1B33;color:#fff;font-size:18px;box-shadow:0 6px 20px rgba(10,26,60,.25)" style-hover="background:#003399">↑</button>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;120px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;projects&quot;,&quot;hub&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, scrolled: false, far: false, w: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  progressRef = React.createRef();
  componentDidMount() {
    this._s = () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      if (this.progressRef.current) this.progressRef.current.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
      const scrolled = scrollY > 20, far = scrollY > innerHeight * 1.2;
      if (scrolled !== this.state.scrolled || far !== this.state.far) this.setState({ scrolled, far });
    };
    this._r = () => { const w = innerWidth; if (w !== this.state.w) this.setState({ w, open: w >= 960 ? false : this.state.open }); };
    addEventListener('scroll', this._s, { passive: true });
    addEventListener('resize', this._r);
    this._s();
  }
  componentDidUpdate(pp, ps) { if (!ps || ps.open !== this.state.open) document.body.style.overflow = this.state.open ? 'hidden' : ''; }
  componentWillUnmount() { removeEventListener('scroll', this._s); removeEventListener('resize', this._r); document.body.style.overflow = ''; }
  renderVals() {
    if (!this.state) return {};
    const a = this.props.active || '';
    const keys = ['about', 'services', 'team', 'projects', 'hub', 'contact'];
    const c = {}, u = {};
    keys.forEach((k) => { c[k] = k === a ? '#003399' : '#0F1B33'; u[k] = k === a ? '#003399' : 'transparent'; });
    const { open, scrolled, far, w } = this.state;
    const wide = w >= 960;
    return {
      progressRef: this.progressRef, c, u, wide, narrow: !wide, open: open && !wide, openStr: open ? 'true' : 'false',
      shadow: scrolled ? '0 4px 24px rgba(10,26,60,.08)' : 'none',
      menuLabel: open ? 'Close' : 'Menu',
      bar1: open ? 'translateY(6px) rotate(45deg)' : 'none', bar2: open ? 0 : 1, bar3: open ? 'translateY(-6px) rotate(-45deg)' : 'none',
      toggle: () => this.setState({ open: !open }),
      close: () => this.setState({ open: false }),
      showTop: far && !open,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
    };
  }
}
</script>
</body>
</html>
